<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Питание">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#14532d">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Питание</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    * { box-sizing:border-box; }
    body { margin:0; background:#fff; color:#000; font:16px/1.4 Arial, sans-serif; }
    main { max-width:720px; margin:0 auto; padding:20px 16px calc(50px + 56px + env(safe-area-inset-bottom, 0px)); }
    h1 { font-size:26px; margin:0 0 10px; }
    .meta { margin:0 0 18px; color:#555; font-size:13px; }
    .empty { margin:8px 0 0; color:#666; }
    .totals { margin:0 0 18px; }
    .totals div { margin:2px 0; }
    .pct { font-weight:bold; }
    .good { color:#28734a; }
    .great { color:#14532d; }
    .low { color:#a16d00; }
    .high { color:#b3261e; }
    .meal { padding:10px 0; border-top:1px solid #ddd; }
    .meal:first-of-type { border-top:1px solid #000; }
    .food { font-weight:bold; }
    section { margin:0 0 34px; }
    .refresh-wrap {
      position:fixed;
      right:max(16px, env(safe-area-inset-right, 0px));
      bottom:max(16px, env(safe-area-inset-bottom, 0px));
      z-index:1000;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .refresh {
      border:1px solid #000;
      border-radius:999px;
      background:#fff;
      color:#000;
      font:600 15px/1 Arial, sans-serif;
      padding:14px 18px;
      min-height:48px;
      min-width:48px;
      box-shadow:0 2px 10px rgba(0,0,0,.15);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
    }
    .refresh:active { background:#f2f2f2; }
    .refresh[disabled] { opacity:.65; cursor:wait; }
    .refresh-status { color:#555; font-size:12px; white-space:nowrap; }
    @media (max-width:520px) { body { font-size:14px; } }
  </style>
</head>
<body>
<main id="app"></main>
<div class="refresh-wrap">
  <span class="refresh-status" id="refresh-status" role="status" aria-live="polite"></span>
  <button type="button" class="refresh" id="refresh" aria-label="Обновить данные">Обновить</button>
</div>
<script>
  // Запасная копия на крайний случай. Живые данные — log.csv с этого же сайта.

    {date:"2026-08-04",time:"22:30",foods:"Баранья шея без кожи/жира-кусков; кола zero",kcal:640,p:42,f:42,c:13,fiber:2.0},
    {date:"2026-08-04",time:"23:00",foods:"Морковный сок больше; мороженое шафран немного",kcal:310,p:4.5,f:9.5,c:51,fiber:2.5},
    {date:"2026-08-05",time:"12:30",foods:"Масала ланч: 2 плашки курицы; имбирный лимонад",kcal:450,p:36,f:14,c:40,fiber:1.0},
    {date:"2026-08-05",time:"16:00",foods:"Kinder ломтик; лавандовый бабл ти",kcal:380,p:6.5,f:14.5,c:55.5,fiber:0.5},
    {date:"2026-08-05",time:"23:59",foods:"Биг Спешиал ролл; грудка 92 г; фри S; карри",kcal:1005,p:51,f:51,c:82,fiber:2.5},
    {date:"2026-08-06",time:"14:30",foods:"Китайка: рис; тофу; свинина; ножка; яйцо; суп",kcal:1000,p:68,f:45,c:85,fiber:4.0},
    {date:"2026-08-06",time:"15:00",foods:"Фильтр с гибискусом; рожок Коровка крем-брюле",kcal:225,p:3,f:14,c:20,fiber:0.3},
    {date:"2026-08-06",time:"19:09",foods:"Онигири с сёмгой х/к 120 г",kcal:265,p:8.6,f:7.7,c:40.3,fiber:0.8},
    {date:"2026-08-06",time:"19:28",foods:"M&M's арахис 80 г; 2 эспрессо с какао/сахаром",kcal:470,p:8.7,f:21.3,c:58,fiber:2.5},
    {date:"2026-08-06",time:"02:00",foods:"Блинчики Морозко с творогом ×2",kcal:320,p:10,f:9,c:48,fiber:1.0},
    {date:"2026-08-06",time:"03:00",foods:"Скуп протеина; сливки 14 г; творог ~50 г",kcal:210,p:33.8,f:6.8,c:3.9,fiber:0},
    {date:"2026-08-07",time:"13:10",foods:"Индейка по-арабски; макароны; салат; Coca-Cola zero",kcal:760,p:59,f:20.5,c:79.5,fiber:5.5},
    {date:"2026-08-07",time:"17:05",foods:"Творожная запеканка 200 г",kcal:400,p:24,f:21,c:28,fiber:0.5},
    {date:"2026-08-07",time:"17:06",foods:"Онигири с сёмгой х/к 120 г",kcal:265,p:8.6,f:7.7,c:40.3,fiber:0.8},
    {date:"2026-08-07",time:"23:35",foods:"Рис; куриный шашлык ×5 из шаурмы; салат; без хлеба",kcal:720,p:44,f:22,c:86,fiber:3.5},
    {date:"2026-08-07",time:"02:00",foods:"Магнат Даниссимо 62 г; джерки 45 г целиком; кола zero",kcal:324,p:27.7,f:14.7,c:21.4,fiber:0.3},
    {date:"2026-08-08",time:"16:36",foods:"Индийская столовая: рис; лепёшки×2; дал; раита; ласси",kcal:1020,p:34,f:28,c:152,fiber:7.5},
    {date:"2026-08-08",time:"17:51",foods:"Пончики ×3 в пудре + варёная сгущёнка; фильтр",kcal:890,p:14,f:40,c:120,fiber:1.5},
  ];
  const targets = {
    restKcal:2250, trainingKcal:2500,
    restCarbs:245, trainingCarbs:308,
    p:160, f:70, fiber:27.5
  };
  const trainingDays = new Set([0, 2, 5]); // вс, вт, пт
  const fmt = n => Number.isInteger(n) ? String(n) : n.toFixed(1).replace(".",",");
  const percent = (value, target) => Math.round(value / target * 20) * 5;
  // mode "floor": белок/клетчатка — чем больше, тем лучше (не красить в красный)
  // mode "ceiling": ккал/жиры/углеводы — перебор = high
  const pct = (value, target, mode = "ceiling") => {
    const valuePct = percent(value, target);
    let tone;
    if (mode === "floor") {
      tone = valuePct < 70 ? "low" : valuePct >= 100 ? "great" : "good";
    } else {
      tone = valuePct < 70 ? "low" : valuePct > 110 ? "high" : "good";
    }
    return `<span class="pct ${tone}">${valuePct}%</span>`;
  };
  const total = xs => xs.reduce((a,x) => ({kcal:a.kcal+x.kcal,p:a.p+x.p,f:a.f+x.f,c:a.c+x.c,fiber:a.fiber+x.fiber}), {kcal:0,p:0,f:0,c:0,fiber:0});
  const app = document.querySelector("#app");
  const refreshBtn = document.querySelector("#refresh");
  const refreshStatus = document.querySelector("#refresh-status");
  const csvUrls = [
    // raw обычно свежее: github.io иногда отдаёт старый log.csv из кэша Pages
    "https://raw.githubusercontent.com/xamartinsa/goals/cursor/nutrition-tracker-agent-5da8/nutrition/log.csv",
    "log.csv"
  ];
  // Ключ без foods: иначе CSV и fallback с разным текстом еды дают дубли,
  // а правки порций/названия не перекрывают старую запись.
  const entryKey = e => `${e.date}|${e.time}`;
  const latestDate = entries => entries.reduce((max, e) => (e.date > max ? e.date : max), "");
  const mergeEntries = (primary, secondary) => {
    const map = new Map();
    for (const e of secondary) map.set(entryKey(e), e);
    for (const e of primary) map.set(entryKey(e), e); // CSV/свежий лог побеждает
    return [...map.values()];
  };
  const fresher = (a, b) => {
    const da = latestDate(a), db = latestDate(b);
    if (da !== db) return da > db ? a : b;
    return a.length >= b.length ? a : b;
  };

  const mealOrder = time => {
    const [hour, minute] = time.split(":").map(Number);
    const minutes = hour * 60 + minute;
    return minutes < 360 ? minutes + 1440 : minutes;
  };
  const displayTime = time => mealOrder(time) >= 1440 ? `${time} (+1)` : time;
  const escapeHtml = s => String(s)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");

  function moscowToday() {
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: "Europe/Moscow",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).format(new Date());
  }

  function moscowTime() {
    return new Date().toLocaleTimeString("ru-RU", {
      timeZone: "Europe/Moscow",
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  function shiftDate(isoDate, days) {
    const [y, m, d] = isoDate.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    dt.setUTCDate(dt.getUTCDate() + days);
    return dt.toISOString().slice(0, 10);
  }

  function dayTitle(date, today, yesterday) {
    if (date === today) return "Сегодня";
    if (date === yesterday) return "Вчера";
    return date.split("-").reverse().join(".");
  }

  function parseCsv(text) {
    const rows = [], row = [];
    let field = "", quoted = false;
    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      if (quoted) {
        if (char === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (char === '"') quoted = false;
        else field += char;
      } else if (char === '"') quoted = true;
      else if (char === ",") { row.push(field); field = ""; }
      else if (char === "\n") { row.push(field); rows.push(row.splice(0)); field = ""; }
      else if (char !== "\r") field += char;
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    const [headers, ...data] = rows;
    return data.filter(row => row.length === headers.length).map(row => {
      const item = Object.fromEntries(headers.map((key, index) => [key, row[index]]));
      return { date:item.date, time:item.time, foods:item.foods,
        kcal:Number(item.kcal), p:Number(item.protein_g), f:Number(item.fat_g),
        c:Number(item.carbs_g), fiber:Number(item.fiber_g) };
    });
  }

  function render(entries) {
    const today = moscowToday();
    const yesterday = shiftDate(today, -1);
    const dates = [...new Set([today, ...entries.map(x => x.date)])].sort().reverse();
    app.innerHTML = dates.map(date => {
      const rows = entries.filter(x => x.date === date).sort((a, b) => mealOrder(b.time) - mealOrder(a.time));
      const titleDay = dayTitle(date, today, yesterday);
      if (!rows.length) {
        return `<section>
      <h1>${titleDay}</h1>
      <div class="empty">Пока ничего</div>
    </section>`;
      }
      const t = total(rows);
      const isTrainingDay = trainingDays.has(new Date(`${date}T12:00:00`).getDay());
      const kcalTarget = isTrainingDay ? targets.trainingKcal : targets.restKcal;
      const carbsTarget = isTrainingDay ? targets.trainingCarbs : targets.restCarbs;
      const mealsHtml = rows.map(x => `<div class="meal"><div>${displayTime(x.time)}</div><div class="food">${escapeHtml(x.foods)}</div><div>${fmt(x.kcal)} ккал · Б ${fmt(x.p)} · Ж ${fmt(x.f)} · У ${fmt(x.c)} · кл. ${fmt(x.fiber)}</div></div>`).join("");
      return `<section>
      <h1>${titleDay}</h1>
      <div class="totals">
        <div>Калории: ${fmt(t.kcal)} ккал · ${pct(t.kcal, kcalTarget)}</div>
        <div>Белок: ${fmt(t.p)} г · ${pct(t.p, targets.p, "floor")}</div>
        <div>Жиры: ${fmt(t.f)} г · ${pct(t.f, targets.f)}</div>
        <div>Углеводы: ${fmt(t.c)} г · ${pct(t.c, carbsTarget)}</div>
        <div>Клетчатка: ${fmt(t.fiber)} г · ${pct(t.fiber, targets.fiber, "floor")}</div>
      </div>
      ${mealsHtml}
    </section>`;
    }).join("");
  }

  function fetchCsv(url) {
    const bust = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    return fetch(`${url}?v=${bust}`, {
      cache: "no-store",
      headers: {
        "Cache-Control": "no-cache",
        Pragma: "no-cache"
      }
    }).then(async response => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const text = await response.text();
      if (!text || !text.includes("date,time,meal_type")) throw new Error("плохой CSV");
      return text;
    });
  }

  function loadData() {
    refreshBtn.disabled = true;
    refreshBtn.textContent = "Обновляю…";
    refreshStatus.textContent = "";

    const fetches = csvUrls.map(url =>
      fetchCsv(url)
        .then(text => {
          const entries = parseCsv(text);
          if (!entries.length) throw new Error("пустой лог");
          return entries;
        })
        .catch(() => null)
    );

    return Promise.all(fetches).then(results => {
      const loaded = results.filter(Boolean);
      if (!loaded.length) {
        render(fallbackEntries);
        refreshStatus.textContent = "нет сети";
        return;
      }
      const best = loaded.reduce(fresher);
      const merged = mergeEntries(best, fallbackEntries);
      render(merged);
      const until = latestDate(merged).split("-").reverse().join(".");
      refreshStatus.textContent = `обновлено ${moscowTime()} · до ${until}`;
    }).finally(() => {
      refreshBtn.disabled = false;
      refreshBtn.textContent = "Обновить";
    });
  }

  refreshBtn.addEventListener("click", () => { loadData(); });
  loadData();
</script>
</body>
</html>
