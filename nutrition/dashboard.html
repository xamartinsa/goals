<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Питание</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; background:#fff; color:#000; font:16px/1.4 Arial, sans-serif; }
    main { max-width:720px; margin:0 auto; padding:20px 16px 50px; }
    h1 { font-size:26px; margin:0 0 10px; }
    .totals { margin:0 0 18px; }
    .totals div { margin:2px 0; }
    .pct { font-weight:bold; }
    .good { color:#28734a; }
    .low { color:#a16d00; }
    .high { color:#b3261e; }
    .meal { padding:10px 0; border-top:1px solid #ddd; }
    .meal:first-of-type { border-top:1px solid #000; }
    .food { font-weight:bold; }
    section { margin:0 0 34px; }
    @media (max-width:520px) { body { font-size:14px; } }
  </style>
</head>
<body>
<main id="app"></main>
<script>
  // Производная копия nutrition/log.csv. Агент обновляет массив после каждой правки CSV.
  const entries = [
    {date:"2026-07-25",time:"16:14",foods:"Осетинские пироги с ботвой/сыром и говядиной; квас",kcal:955,p:37.5,f:42,c:101.5,fiber:5},
    {date:"2026-07-25",time:"22:23",foods:"Куриное бедро в лепинье; окрошка; шопский салат; лимонад",kcal:1650,p:77,f:72,c:153,fiber:9},
    {date:"2026-07-26",time:"02:30",foods:"Сидр сухой «Дальняя Дача» ×3",kcal:608,p:0,f:0,c:6.8,fiber:0},
    {date:"2026-07-26",time:"15:00",foods:"Теремок: ветчина-сыр; Алёша Попович; лаванда с заварным кремом",kcal:1528,p:53.7,f:85.6,c:137.2,fiber:2},
    {date:"2026-07-26",time:"21:22",foods:"Тонкий хинкал с говядиной; овощная нарезка; соусы",kcal:850,p:42,f:30,c:105,fiber:5}
  ];
  const targets = {
    restKcal:2250, trainingKcal:2500,
    restCarbs:245, trainingCarbs:308,
    p:160, f:70, fiber:27.5
  };
  const trainingDays = new Set([0, 2, 5]); // вс, вт, пт
  const fmt = n => Number.isInteger(n) ? String(n) : n.toFixed(1).replace(".",",");
  const percent = (value, target) => Math.round(value / target * 20) * 5;
  const pct = (value, target) => {
    const valuePct = percent(value, target);
    const tone = valuePct < 70 ? "low" : valuePct > 110 ? "high" : "good";
    return `<span class="pct ${tone}">${valuePct}%</span>`;
  };
  const total = xs => xs.reduce((a,x) => ({kcal:a.kcal+x.kcal,p:a.p+x.p,f:a.f+x.f,c:a.c+x.c,fiber:a.fiber+x.fiber}), {kcal:0,p:0,f:0,c:0,fiber:0});
  const dates = [...new Set(entries.map(x=>x.date))].sort().reverse();
  const app = document.querySelector("#app");
  app.innerHTML = dates.map((date,index) => {
    const rows = entries.filter(x=>x.date===date), t = total(rows);
    const title = index === 0 ? "Сегодня" : index === 1 ? "Вчера" : date.split("-").reverse().join(".");
    const isTrainingDay = trainingDays.has(new Date(`${date}T12:00:00`).getDay());
    const kcalTarget = isTrainingDay ? targets.trainingKcal : targets.restKcal;
    const carbsTarget = isTrainingDay ? targets.trainingCarbs : targets.restCarbs;
    return `<section>
      <h1>${title}</h1>
      <div class="totals">
        <div>Калории: ${fmt(t.kcal)} ккал · ${pct(t.kcal, kcalTarget)}</div>
        <div>Белок: ${fmt(t.p)} г · ${pct(t.p, targets.p)}</div>
        <div>Жиры: ${fmt(t.f)} г · ${pct(t.f, targets.f)}</div>
        <div>Углеводы: ${fmt(t.c)} г · ${pct(t.c, carbsTarget)}</div>
        <div>Клетчатка: ${fmt(t.fiber)} г · ${pct(t.fiber, targets.fiber)}</div>
      </div>
      ${rows.map(x=>`<div class="meal"><div>${x.time}</div><div class="food">${x.foods}</div><div>${fmt(x.kcal)} ккал · Б ${fmt(x.p)} · Ж ${fmt(x.f)} · У ${fmt(x.c)} · кл. ${fmt(x.fiber)}</div></div>`).join("")}
    </section>`;
  }).join("");
</script>
</body>
</html>
