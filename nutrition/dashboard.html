<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Питание</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; background:#fff; color:#000; font:16px/1.4 Arial, sans-serif; }
    main { max-width:720px; margin:0 auto; padding:20px 16px calc(50px + 56px + env(safe-area-inset-bottom, 0px)); }
    h1 { font-size:26px; margin:0 0 10px; }
    .meta { margin:0 0 18px; color:#555; font-size:13px; }
    .empty { margin:8px 0 0; color:#666; }
    .totals { margin:0 0 18px; }
    .totals div { margin:2px 0; }
    .pct { font-weight:bold; }
    .good { color:#28734a; }
    .low { color:#a16d00; }
    .high { color:#b3261e; }
    .meal { padding:10px 0; border-top:1px solid #ddd; }
    .meal:first-of-type { border-top:1px solid #000; }
    .food { font-weight:bold; }
    section { margin:0 0 34px; }
    .refresh-wrap {
      position:fixed;
      right:max(16px, env(safe-area-inset-right, 0px));
      bottom:max(16px, env(safe-area-inset-bottom, 0px));
      z-index:1000;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .refresh {
      border:1px solid #000;
      border-radius:999px;
      background:#fff;
      color:#000;
      font:600 15px/1 Arial, sans-serif;
      padding:14px 18px;
      min-height:48px;
      min-width:48px;
      box-shadow:0 2px 10px rgba(0,0,0,.15);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
    }
    .refresh:active { background:#f2f2f2; }
    .refresh[disabled] { opacity:.65; cursor:wait; }
    .refresh-status { color:#555; font-size:12px; white-space:nowrap; }
    @media (max-width:520px) { body { font-size:14px; } }
  </style>
</head>
<body>
<main id="app"></main>
<div class="refresh-wrap">
  <span class="refresh-status" id="refresh-status" role="status" aria-live="polite"></span>
  <button type="button" class="refresh" id="refresh" aria-label="Обновить данные">Обновить</button>
</div>
<script>
  // Запасная копия на крайний случай. Живые данные — log.csv с этого же сайта.
  const fallbackEntries = [
    {date:"2026-07-25",time:"16:14",foods:"Осетинские пироги с ботвой/сыром и говядиной; квас",kcal:955,p:37.5,f:42,c:101.5,fiber:5},
    {date:"2026-07-25",time:"22:23",foods:"Куриное бедро в лепинье; окрошка; шопский салат; лимонад",kcal:1650,p:77,f:72,c:153,fiber:9},
    {date:"2026-07-25",time:"02:30",foods:"Сидр сухой «Дальняя Дача» ×3 (после полуночи, до сна)",kcal:608,p:0,f:0,c:6.8,fiber:0},
    {date:"2026-07-26",time:"15:00",foods:"Теремок: ветчина-сыр; Алёша Попович; лаванда с заварным кремом",kcal:1528,p:53.7,f:85.6,c:137.2,fiber:2},
    {date:"2026-07-26",time:"21:22",foods:"Тонкий хинкал с говядиной; овощи; красный соус; бульон",kcal:925,p:52,f:32,c:105,fiber:5},
    {date:"2026-07-26",time:"02:03",foods:"Пломбир Коровка из Кореновки крем-брюле 100 г; коктейль NEO High Protein шоколад",kcal:400,p:33,f:14.9,c:32.9,fiber:0},
    {date:"2026-07-27",time:"16:01",foods:"Овсяная каша на воде; фруктовое пюре в кашу; чурчхела",kcal:350,p:9.2,f:8.5,c:57.7,fiber:8.1},
    {date:"2026-07-27",time:"16:14",foods:"Пельмени со свининой жареные на масле",kcal:710,p:30.6,f:40,c:58.3,fiber:2.8},
    {date:"2026-07-27",time:"21:00",foods:"Макароны с сыром; куриная грудка жареная",kcal:680,p:46.5,f:19.8,c:84.5,fiber:5.6},
    {date:"2026-07-27",time:"22:11",foods:"Мороженое Светаево рожок с шоколадом (Чижик)",kcal:250,p:3.5,f:14,c:28,fiber:0.5},
    {date:"2026-07-27",time:"23:30",foods:"San Pellegrino Aranciata Rossa (красный апельсин)",kcal:65,p:0,f:0,c:14.5,fiber:0},
    {date:"2026-07-27",time:"02:33",foods:"Творог 5% 200 г; NEO High Protein шоколад 260 г",kcal:426,p:64.4,f:10.9,c:17.5,fiber:0},
    {date:"2026-07-28",time:"16:02",foods:"Китайка: рис; печень в подливе 2 плошки; рыба; листовой тофу; капуста; суп; кофе фильтр",kcal:1010,p:56,f:43,c:96,fiber:5},
    {date:"2026-07-28",time:"16:21",foods:"Kinder Maxi",kcal:110,p:1.5,f:7.2,c:10.5,fiber:0},
    {date:"2026-07-28",time:"21:07",foods:"Мармелад-ремешок кола ×2",kcal:155,p:0.2,f:0,c:35.7,fiber:0},
    {date:"2026-07-28",time:"23:14",foods:"Сирийская кухня: крылья ×10, рис, куриный шашлык без лаваша, соусы/салаты, кнафе",kcal:1400,p:80,f:60,c:145,fiber:7},
    {date:"2026-07-28",time:"01:06",foods:"Протеин 1 скуп; укус печенья",kcal:165,p:25,f:4,c:9,fiber:0.2},
    {date:"2026-07-29",time:"12:58",foods:"Гречка; горбуша в панировке; салат; компот",kcal:690,p:43,f:22,c:82,fiber:10},
    {date:"2026-07-29",time:"14:00",foods:"Половина финикового печенья; кофе фильтр",kcal:105,p:1.5,f:3.5,c:16,fiber:1},
    {date:"2026-07-29",time:"16:48",foods:"Сэндвич-ролл Цезарь Samokat 160 г",kcal:360,p:15,f:18,c:35,fiber:2.5}
  ];
  const targets = {
    restKcal:2250, trainingKcal:2500,
    restCarbs:245, trainingCarbs:308,
    p:160, f:70, fiber:27.5
  };
  const trainingDays = new Set([0, 2, 5]); // вс, вт, пт
  const fmt = n => Number.isInteger(n) ? String(n) : n.toFixed(1).replace(".",",");
  const percent = (value, target) => Math.round(value / target * 20) * 5;
  const pct = (value, target) => {
    const valuePct = percent(value, target);
    const tone = valuePct < 70 ? "low" : valuePct > 110 ? "high" : "good";
    return `<span class="pct ${tone}">${valuePct}%</span>`;
  };
  const total = xs => xs.reduce((a,x) => ({kcal:a.kcal+x.kcal,p:a.p+x.p,f:a.f+x.f,c:a.c+x.c,fiber:a.fiber+x.fiber}), {kcal:0,p:0,f:0,c:0,fiber:0});
  const app = document.querySelector("#app");
  const refreshBtn = document.querySelector("#refresh");
  const refreshStatus = document.querySelector("#refresh-status");
  const csvUrls = [
    "log.csv",
    "https://raw.githubusercontent.com/xamartinsa/goals/cursor/nutrition-tracker-agent-5da8/nutrition/log.csv"
  ];

  const mealOrder = time => {
    const [hour, minute] = time.split(":").map(Number);
    const minutes = hour * 60 + minute;
    return minutes < 360 ? minutes + 1440 : minutes;
  };
  const displayTime = time => mealOrder(time) >= 1440 ? `${time} (+1)` : time;
  const escapeHtml = s => String(s)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");

  function moscowToday() {
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: "Europe/Moscow",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).format(new Date());
  }

  function moscowTime() {
    return new Date().toLocaleTimeString("ru-RU", {
      timeZone: "Europe/Moscow",
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  function shiftDate(isoDate, days) {
    const [y, m, d] = isoDate.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    dt.setUTCDate(dt.getUTCDate() + days);
    return dt.toISOString().slice(0, 10);
  }

  function dayTitle(date, today, yesterday) {
    if (date === today) return "Сегодня";
    if (date === yesterday) return "Вчера";
    return date.split("-").reverse().join(".");
  }

  function parseCsv(text) {
    const rows = [], row = [];
    let field = "", quoted = false;
    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      if (quoted) {
        if (char === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (char === '"') quoted = false;
        else field += char;
      } else if (char === '"') quoted = true;
      else if (char === ",") { row.push(field); field = ""; }
      else if (char === "\n") { row.push(field); rows.push(row.splice(0)); field = ""; }
      else if (char !== "\r") field += char;
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    const [headers, ...data] = rows;
    return data.filter(row => row.length === headers.length).map(row => {
      const item = Object.fromEntries(headers.map((key, index) => [key, row[index]]));
      return { date:item.date, time:item.time, foods:item.foods,
        kcal:Number(item.kcal), p:Number(item.protein_g), f:Number(item.fat_g),
        c:Number(item.carbs_g), fiber:Number(item.fiber_g) };
    });
  }

  function render(entries) {
    const today = moscowToday();
    const yesterday = shiftDate(today, -1);
    const dates = [...new Set([today, ...entries.map(x => x.date)])].sort().reverse();
    app.innerHTML = dates.map(date => {
      const rows = entries.filter(x => x.date === date).sort((a, b) => mealOrder(b.time) - mealOrder(a.time));
      const t = total(rows);
      const titleDay = dayTitle(date, today, yesterday);
      const isTrainingDay = trainingDays.has(new Date(`${date}T12:00:00`).getDay());
      const kcalTarget = isTrainingDay ? targets.trainingKcal : targets.restKcal;
      const carbsTarget = isTrainingDay ? targets.trainingCarbs : targets.restCarbs;
      const mealsHtml = rows.length
        ? rows.map(x => `<div class="meal"><div>${displayTime(x.time)}</div><div class="food">${escapeHtml(x.foods)}</div><div>${fmt(x.kcal)} ккал · Б ${fmt(x.p)} · Ж ${fmt(x.f)} · У ${fmt(x.c)} · кл. ${fmt(x.fiber)}</div></div>`).join("")
        : `<div class="empty">Пока пусто</div>`;
      return `<section>
      <h1>${titleDay}</h1>
      <div class="totals">
        <div>Калории: ${fmt(t.kcal)} ккал · ${pct(t.kcal, kcalTarget)}</div>
        <div>Белок: ${fmt(t.p)} г · ${pct(t.p, targets.p)}</div>
        <div>Жиры: ${fmt(t.f)} г · ${pct(t.f, targets.f)}</div>
        <div>Углеводы: ${fmt(t.c)} г · ${pct(t.c, carbsTarget)}</div>
        <div>Клетчатка: ${fmt(t.fiber)} г · ${pct(t.fiber, targets.fiber)}</div>
      </div>
      ${mealsHtml}
    </section>`;
    }).join("");
  }

  function fetchCsv(url) {
    const bust = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    return fetch(`${url}?v=${bust}`, {
      cache: "no-store",
      headers: {
        "Cache-Control": "no-cache",
        Pragma: "no-cache"
      }
    }).then(async response => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const text = await response.text();
      if (!text || !text.includes("date,time,meal_type")) throw new Error("плохой CSV");
      return text;
    });
  }

  function loadData() {
    refreshBtn.disabled = true;
    refreshBtn.textContent = "Обновляю…";
    refreshStatus.textContent = "";

    const tryNext = (index) => {
      if (index >= csvUrls.length) {
        render(fallbackEntries);
        refreshStatus.textContent = "нет сети";
        return Promise.resolve();
      }
      return fetchCsv(csvUrls[index])
        .then(text => {
          const entries = parseCsv(text);
          if (!entries.length) throw new Error("пустой лог");
          render(entries);
          refreshStatus.textContent = `обновлено ${moscowTime()}`;
        })
        .catch(err => {
          return tryNext(index + 1);
        });
    };

    return tryNext(0).finally(() => {
      refreshBtn.disabled = false;
      refreshBtn.textContent = "Обновить";
    });
  }

  refreshBtn.addEventListener("click", () => { loadData(); });
  loadData();
</script>
</body>
</html>
