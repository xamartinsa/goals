  <style>
    :root {
      --ink:#000;
      --muted:#555;
      --label:#9a9a9a;
      --line:#e2e2e2;
      --bg:#fff;
      --card:#fff;
      --good:#28734a;
      --great:#14532d;
      --low:#FF9500;
      --high:#FF3B30;
      --font:"IBM Plex Sans", system-ui, sans-serif;
      --font-num:"IBM Plex Sans", system-ui, sans-serif;
      --gutter:22px;
      --head-h:36px;
    }
    * { box-sizing:border-box; }
    html, body { min-height:100%; }
    body {
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font:16px/1.45 var(--font);
      letter-spacing:-0.01em;
    }
    .kbju-head {
      position:fixed;
      top:0;
      left:0;
      right:0;
      z-index:30;
      background:#fff;
      padding-top:env(safe-area-inset-top, 0px);
    }
    .kbju-head-inner {
      max-width:720px;
      margin:0 auto;
      padding:14px var(--gutter) 8px;
    }
    .kbju-head .totals { margin:0; }
    main {
      max-width:720px;
      margin:0 auto;
      padding:calc(var(--head-h) + env(safe-area-inset-top, 0px) + 10px) var(--gutter) calc(120px + env(safe-area-inset-bottom, 0px));
    }
    h1 {
      font-size:11px;
      font-weight:400;
      margin:0;
      letter-spacing:0;
    }
    .day-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin:0 0 6px;
    }
    .day-head h1 { flex:1; min-width:0; }
    .chevron { display:none; }
    details.day > summary {
      list-style:none;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    details.day > summary::-webkit-details-marker { display:none; }
    details.day > summary .totals { margin-bottom:0; }
    details.day[open] .meals { margin-top:10px; }
    .meta { margin:0 0 22px; color:var(--muted); font-size:13px; }
    .empty { margin:8px 0 0; color:var(--muted); }
    .totals {
      display:flex;
      flex-direction:row;
      flex-wrap:nowrap;
      justify-content:space-between;
      align-items:flex-start;
      gap:16px;
      width:100%;
      margin:0 0 10px;
    }
    .total {
      display:flex;
      flex:1 1 0;
      min-width:0;
      flex-direction:column;
      align-items:flex-start;
      gap:0;
    }
    .total-label {
      font-size:8px;
      line-height:1.2;
      font-weight:700;
      letter-spacing:0;
      text-transform:uppercase;
      font-variant:small-caps;
      color:var(--label);
    }
    .macros {
      display:inline-flex;
      align-items:center;
      font-family:var(--font-num);
      font-size:14px;
      line-height:1.2;
      font-weight:400;
      letter-spacing:0;
      font-feature-settings:"tnum" 1, "lnum" 1, "zero" 0;
      font-variant-numeric:tabular-nums lining-nums;
    }
    .mark {
      display:inline-flex;
      align-items:center;
      margin-left:0.22em;
    }
    .mark:empty { display:none; }
    .mark svg { display:block; }
    .mark-ok { color:#12c45a; }
    .mark.high { color:var(--high); }
    .mark.low { color:var(--low); }
    .mark-signal { width:14px; height:14px; }
    .mark-signal .ring { opacity:0; }
    .bars-1 .mark-signal .ring:nth-child(1) { opacity:1; }
    .bars-2 .mark-signal .ring:nth-child(1),
    .bars-2 .mark-signal .ring:nth-child(2) { opacity:1; }
    .bars-3 .mark-signal .ring:nth-child(1),
    .bars-3 .mark-signal .ring:nth-child(2),
    .bars-3 .mark-signal .ring:nth-child(3) { opacity:1; }
    .bars-4 .mark-signal .ring:nth-child(1),
    .bars-4 .mark-signal .ring:nth-child(2),
    .bars-4 .mark-signal .ring:nth-child(3),
    .bars-4 .mark-signal .ring:nth-child(4) { opacity:1; }
    .bars-5 .mark-signal .ring { opacity:1; }
    .meals {
      display:flex;
      flex-direction:column;
      gap:16px;
      margin:10px calc(-1 * var(--gutter)) 0;
      padding:14px var(--gutter);
      border-radius:0;
      position:relative;
      z-index:3;
      background:rgba(247,247,247,.28);
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
    }
    .meal { padding:0; border:0; background:none; }
    .meal-time {
      font-size:11px;
      font-weight:400;
      line-height:1.3;
      color:var(--ink);
      margin:0 0 2px;
    }
    .meal .food { font-size:11px; font-weight:400; color:var(--ink); }
    .meal .totals { margin:4px 0 0; }
    .share {
      font-size:8px;
      line-height:1;
      font-weight:400;
      color:var(--label);
      margin-left:0.12em;
      align-self:flex-start;
      position:relative;
      top:0;
    }
    section .total-label { display:none; }
    .meal .total-label { display:none; }
    .good { color:var(--good); }
    .great { color:var(--great); }
    .low { color:var(--low); }
    .high { color:var(--high); }
    .food { font-weight:400; }
    section { margin:0 0 26px; position:relative; }
    .board { position:relative; max-width:720px; margin:0 auto; }
    .viz-flow {
      position:absolute;
      left:0;
      top:0;
      width:100%;
      height:100%;
      pointer-events:none;
      z-index:1;
      overflow:visible;
    }
    body[data-viz="rings"] .viz-flow { display:none; }
    body[data-viz="graph"] .mark,
    body[data-viz="ribbon"] .mark { display:none; }
    .refresh-wrap {
      position:fixed;
      bottom:max(16px, env(safe-area-inset-bottom, 0px));
      right:max(16px, env(safe-area-inset-right, 0px));
      z-index:1000;
      display:flex;
      flex-direction:row;
      gap:10px;
    }
    .refresh {
      appearance:none;
      width:44px;
      height:44px;
      padding:0;
      border:0.5px solid rgba(255,255,255,.95);
      border-radius:50%;
      background:rgba(255,255,255,.48);
      color:#000;
      display:grid;
      place-items:center;
      backdrop-filter:blur(20px) brightness(1.28) saturate(1.15);
      -webkit-backdrop-filter:blur(20px) brightness(1.28) saturate(1.15);
      box-shadow:0 3px 10px rgba(0,0,0,.055), 0 1px 2px rgba(0,0,0,.04);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
    }
    .refresh svg { width:22px; height:22px; display:block; }
    body[data-viz="rings"] .viz-icon-rings,
    body[data-viz="rings"] .viz-icon-ribbon { display:none; }
    body[data-viz="graph"] .viz-icon-graph,
    body[data-viz="graph"] .viz-icon-rings { display:none; }
    body[data-viz="ribbon"] .viz-icon-graph,
    body[data-viz="ribbon"] .viz-icon-ribbon { display:none; }
    .refresh:active { background:rgba(255,255,255,.62); }
    .refresh[disabled] { opacity:.55; cursor:wait; }
    .refresh.is-loading svg { animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (max-width:520px) { body { font-size:14px; } }
  </style>

    {date:"2026-08-09",time:"22:22",foods:"Тонкий хинкал с говядиной; соусы; нарезка с сыром; сок",kcal:1230,p:60,f:42,c:132,fiber:7.0},
    {date:"2026-08-09",time:"02:17",foods:"Коровка крем-брюле рожок; джерки 45 г; кола zero",kcal:336,p:28.0,f:16.3,c:20.0,fiber:0.3},
    {date:"2026-08-10",time:"12:47",foods:"Индийская: рис; палак; куриное карри×2; lemon ginger лимонад",kcal:930,p:46.0,f:35.0,c:108.0,fiber:4.5},
    {date:"2026-08-10",time:"15:58",foods:"Drinkit гриль-маффин без верхнего хлеба; фисташковый пломбир",kcal:579,p:23.1,f:34.4,c:43.5,fiber:1.2},
    {date:"2026-08-10",time:"17:00",foods:"Kinder Country (кранч); фильтр",kcal:137,p:2.0,f:7.9,c:12.9,fiber:0.3},
    {date:"2026-08-10",time:"19:14",foods:"Exponenta High-Pro безлактозная 250 г",kcal:150,p:30.0,f:0.0,c:6.3,fiber:0.0},
    {date:"2026-08-10",time:"22:18",foods:"Творог 5% 180 г; ½ бананового коктейля 0.5 л",kcal:386,p:38.0,f:14.0,c:27.0,fiber:0.0},
    {date:"2026-08-10",time:"00:38",foods:"Джерки ×2 пачки 90 г; кола zero",kcal:232,p:50.0,f:4.6,c:0.0,fiber:0.0},
    {date:"2026-08-11",time:"12:51",meal_type:"lunch",foods:"Крылья ×3; треска в яйце; гречка; 2 салата",kcal:800,p:62.0,f:33.0,c:78.0,fiber:10.0},
    {date:"2026-08-11",time:"13:10",meal_type:"snack",foods:"Вологодский пломбир шоколадный стаканчик 100 г",kcal:210,p:4.0,f:11.5,c:22.0,fiber:0.5},
    {date:"2026-08-11",time:"17:19",meal_type:"snack",foods:"Запеканка картофельная с мясом Самокат 230 г",kcal:311,p:20.7,f:9.2,c:34.5,fiber:2.0},
    {date:"2026-08-12",time:"13:33",meal_type:"lunch",foods:"Бун ча с курицей; шашлычок; лапша; соус; ростки",kcal:855,p:69.0,f:24.0,c:90.0,fiber:4.5},
    {date:"2026-08-12",time:"13:33",meal_type:"snack",foods:"Пломбир двухслойный шоколадный 105 г",kcal:258,p:4.1,f:15.1,c:26.5,fiber:0.5},
  ];
  const targets = {
    restKcal:2250, trainingKcal:2500,
    restCarbs:245, trainingCarbs:308,
    p:160, f:70, fiber:27.5
  };
  const trainingDays = new Set([0, 2, 5]); // вс, вт, пт
  const fmtInt = n => String(Math.round(n));
  const percent = (value, target) => Math.round(value / target * 20) * 5;
  // mode "floor": белок/клетчатка — чем больше, тем лучше (не красить в красный)
  // mode "ceiling": ккал/жиры/углеводы — перебор = high
  const rings = `<circle class="ring" cx="8" cy="8" r="1" fill="currentColor"/><circle class="ring" cx="8" cy="8" r="2.35" fill="none" stroke="currentColor" stroke-width="1.05"/><circle class="ring" cx="8" cy="8" r="3.8" fill="none" stroke="currentColor" stroke-width="1.05"/><circle class="ring" cx="8" cy="8" r="5.25" fill="none" stroke="currentColor" stroke-width="1.05"/><circle class="ring" cx="8" cy="8" r="6.7" fill="none" stroke="currentColor" stroke-width="1.05"/>`;
  const signalSvg = `<svg class="mark-signal" viewBox="0 0 16 16" aria-hidden="true">${rings}</svg>`;
  const mark = (value, target, mode = "ceiling", opts = {}) => {
    const valuePct = percent(value, target);
    if (mode === "floor") {
      if (opts.warnBelow && valuePct < 95) {
        const bars = valuePct < 50 ? 1 : 2;
        return `<span class="mark low bars-${bars}" title="${valuePct}%">${signalSvg}</span>`;
      }
      if (valuePct >= 120) return `<span class="mark mark-ok bars-5" title="${valuePct}%">${signalSvg}</span>`;
      if (valuePct >= 95) return `<span class="mark mark-ok bars-4" title="${valuePct}%">${signalSvg}</span>`;
      if (valuePct >= 70) return `<span class="mark mark-ok bars-3" title="${valuePct}%">${signalSvg}</span>`;
      if (valuePct >= 50) return `<span class="mark low bars-2" title="${valuePct}%">${signalSvg}</span>`;
      if (valuePct > 0) return `<span class="mark high bars-2" title="${valuePct}%">${signalSvg}</span>`;
      return "";
    }
    const bars = valuePct > 170 ? 5 : valuePct > 150 ? 4 : valuePct > 130 ? 3 : 0;
    if (bars) return `<span class="mark high bars-${bars}" title="${valuePct}%">${signalSvg}</span>`;
    if (valuePct > 110) return `<span class="mark low bars-2" title="${valuePct}%">${signalSvg}</span>`;
    if (valuePct >= 70) return `<span class="mark mark-ok bars-4" title="${valuePct}%">${signalSvg}</span>`;
    if (valuePct >= 50) return `<span class="mark low bars-2" title="${valuePct}%">${signalSvg}</span>`;
    if (valuePct > 0) return `<span class="mark high bars-2" title="${valuePct}%">${signalSvg}</span>`;
    return "";
  };
  const statusOf = (value, target, mode = "ceiling", opts = {}) => {
    const valuePct = percent(value, target);
    if (mode === "floor") {
      if (opts.warnBelow && valuePct < 95) return {pct:valuePct, tone:"low"};
      if (valuePct >= 70) return {pct:valuePct, tone:"ok"};
      if (valuePct >= 50) return {pct:valuePct, tone:"low"};
      if (valuePct > 0) return {pct:valuePct, tone:"high"};
      return {pct:0, tone:""};
    }
    if (valuePct > 130) return {pct:valuePct, tone:"high"};
    if (valuePct > 110) return {pct:valuePct, tone:"low"};
    if (valuePct >= 70) return {pct:valuePct, tone:"ok"};
    if (valuePct >= 50) return {pct:valuePct, tone:"low"};
    if (valuePct > 0) return {pct:valuePct, tone:"high"};
    return {pct:0, tone:""};
  };
  const dayExtra = (value, target, mode = "ceiling", opts = {}) => mark(value, target, mode, opts);
  const total = xs => xs.reduce((a,x) => ({kcal:a.kcal+x.kcal,p:a.p+x.p,f:a.f+x.f,c:a.c+x.c,fiber:a.fiber+x.fiber}), {kcal:0,p:0,f:0,c:0,fiber:0});
  const app = document.querySelector("#app");
  const refreshBtn = document.querySelector("#refresh");
  const vizSvg = document.querySelector("#viz");
  const vizToggle = document.querySelector("#vizToggle");
  const toneColor = {ok:"#12c45a", low:"#FF9500", high:"#FF3B30"};

  const catmull = pts => {
    if (!pts.length) return "";
    if (pts.length === 1) return `M ${pts[0].x} ${pts[0].y}`;
    let d = `M ${pts[0].x} ${pts[0].y}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[Math.min(pts.length - 1, i + 2)];
      d += ` C ${p1.x + (p2.x - p0.x) / 6} ${p1.y + (p2.y - p0.y) / 6} ${p2.x - (p3.x - p1.x) / 6} ${p2.y - (p3.y - p1.y) / 6} ${p2.x} ${p2.y}`;
    }
    return d;
  };

  const ribbonPath = pts => {
    if (pts.length === 1) {
      const p = pts[0];
      return `M ${p.x} ${p.y - p.r} A ${p.r} ${p.r} 0 1 1 ${p.x} ${p.y + p.r} A ${p.r} ${p.r} 0 1 1 ${p.x} ${p.y - p.r} Z`;
    }
    const right = pts.map(p => ({x:p.x + p.r, y:p.y}));
    const left = pts.map(p => ({x:p.x - p.r, y:p.y})).reverse();
    return `${catmull(right)} ${catmull(left).replace(/^M/, "L")} Z`;
  };

  function drawGraph() {
    if (!vizSvg) return;
    const mode = document.body.dataset.viz;
    if (mode === "rings") {
      vizSvg.innerHTML = "";
      return;
    }
    const board = vizSvg.parentElement;
    const origin = app.getBoundingClientRect();
    const boardBox = board.getBoundingClientRect();
    const w = app.offsetWidth;
    const h = app.offsetHeight;
    vizSvg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    vizSvg.setAttribute("width", String(w));
    vizSvg.setAttribute("height", String(h));
    vizSvg.style.top = `${origin.top - boardBox.top}px`;
    vizSvg.style.left = `${origin.left - boardBox.left}px`;
    vizSvg.style.width = `${w}px`;
    vizSvg.style.height = `${h}px`;

    const shiftX = mode === "graph";
    const cols = [[], [], [], [], []];
    const addRow = row => {
      [...row.children].forEach((cell, i) => {
        if (i > 4) return;
        const box = cell.getBoundingClientRect();
        const pct = Number(cell.dataset.pct || 0);
        const tone = cell.dataset.tone || "";
        if (!tone && !pct) return;
        const left = box.left - origin.left;
        const bandLeft = left + box.width * 0.75;
        const bandRight = left + box.width - 2;
        const t = Math.min(Math.max(pct, 0), 200) / 200;
        const over = Math.max(0, pct - 110);
        cols[i].push({
          x: shiftX ? bandLeft + t * (bandRight - bandLeft) : (bandLeft + bandRight) / 2,
          y: box.top - origin.top + box.height / 2,
          r: 1.4 + pct * 0.014 + over * 0.022,
          color: toneColor[tone] || toneColor.ok,
          pct
        });
      });
    };
    app.querySelectorAll("section").forEach(sec => {
      const details = sec.querySelector("details.day");
      const open = !details || details.open;
      const day = sec.querySelector(".day-totals");
      if (day) addRow(day);
      if (open) sec.querySelectorAll(".meal-totals").forEach(addRow);
    });

    if (cols.every(c => !c.length)) {
      vizSvg.innerHTML = "";
      return;
    }

    let defs = "";
    let paths = "";
    cols.forEach((pts, i) => {
      if (pts.length < 1) return;
      const y0 = pts[0].y;
      const y1 = pts[pts.length - 1].y;
      const span = Math.max(y1 - y0, 1);
      const stops = pts.map(p => {
        const off = ((p.y - y0) / span * 100).toFixed(1);
        return `<stop offset="${off}%" stop-color="${p.color}"/>`;
      }).join("");
      defs += `<linearGradient id="flow${i}" gradientUnits="userSpaceOnUse" x1="0" y1="${y0}" x2="0" y2="${y1}">${stops}</linearGradient>`;
      if (mode === "ribbon") {
        paths += `<path d="${ribbonPath(pts)}" fill="url(#flow${i})" fill-opacity=".82"/>`;
      } else {
        paths += `<path d="${catmull(pts)}" fill="none" stroke="url(#flow${i})" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
      }
    });
    vizSvg.innerHTML = `<defs>${defs}</defs>${paths}`;
  }
  const csvUrls = [
    // raw обычно свежее: github.io иногда отдаёт старый log.csv из кэша Pages
    "https://raw.githubusercontent.com/xamartinsa/goals/cursor/nutrition-tracker-agent-5da8/nutrition/log.csv",
    "log.csv"
  ];
  // CSV — источник истины целиком (все строки, даже несколько в одну минуту).
  // Fallback дополняет только минуты, которых в CSV ещё нет — иначе старый
  // ключ date|time схлопывал обед+мороженое в 13:33 в одну запись.
  const latestDate = entries => entries.reduce((max, e) => (e.date > max ? e.date : max), "");
  const mergeEntries = (primary, secondary) => {
    const out = [...primary];
    const coveredSlots = new Set(primary.map(e => `${e.date}|${e.time}`));
    for (const e of secondary) {
      const slot = `${e.date}|${e.time}`;
      if (coveredSlots.has(slot)) continue;
      out.push(e);
      coveredSlots.add(slot);
    }
    return out;
  };
  const fresher = (a, b) => {
    const da = latestDate(a), db = latestDate(b);
    if (da !== db) return da > db ? a : b;
    return a.length >= b.length ? a : b;
  };

  const mealOrder = time => {
    const [hour, minute] = time.split(":").map(Number);
    const minutes = hour * 60 + minute;
    return minutes < 360 ? minutes + 1440 : minutes;
  };
  const escapeHtml = s => String(s)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
  const prettyFoods = s => String(s)
    .replace(/кофе фильтр/gi, "фильтр-кофе")
    .replace(/(^|;\s*)(\S)/g, (_, p, c) => p + c.toLocaleUpperCase("ru"));

  function moscowToday() {
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: "Europe/Moscow",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).format(new Date());
  }

  function shiftDate(isoDate, days) {
    const [y, m, d] = isoDate.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    dt.setUTCDate(dt.getUTCDate() + days);
    return dt.toISOString().slice(0, 10);
  }

  const monthNames = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  function dayTitle(date, today, yesterday) {
    if (date === today) return "Сегодня";
    if (date === yesterday) return "Вчера";
    const [y, m, d] = date.split("-").map(Number);
    return `${d} ${monthNames[m - 1]}`;
  }

  function parseCsv(text) {
    const rows = [], row = [];
    let field = "", quoted = false;
    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      if (quoted) {
        if (char === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (char === '"') quoted = false;
        else field += char;
      } else if (char === '"') quoted = true;
      else if (char === ",") { row.push(field); field = ""; }
      else if (char === "\n") { row.push(field); rows.push(row.splice(0)); field = ""; }
      else if (char !== "\r") field += char;
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    const [headers, ...data] = rows;
    return data.filter(row => row.length === headers.length).map(row => {
      const item = Object.fromEntries(headers.map((key, index) => [key, row[index]]));
      return { date:item.date, time:item.time, meal_type:item.meal_type || "", foods:item.foods,
        kcal:Number(item.kcal), p:Number(item.protein_g), f:Number(item.fat_g),
        c:Number(item.carbs_g), fiber:Number(item.fiber_g) };
    });
  }

  function render(entries) {
    const today = moscowToday();
    const yesterday = shiftDate(today, -1);
    const dates = [...new Set([today, ...entries.map(x => x.date)])].sort().reverse();
    const todayEmpty = !entries.some(x => x.date === today);
    app.innerHTML = dates.map(date => {
      const rows = entries.filter(x => x.date === date).sort((a, b) => mealOrder(b.time) - mealOrder(a.time));
      const titleDay = date === today && !rows.length ? "Сегодня пока пусто" : dayTitle(date, today, yesterday);
      if (!rows.length) {
        return `<section>
      <div class="day-head"><h1>${titleDay}</h1></div>
    </section>`;
      }
      const t = total(rows);
      const isTrainingDay = trainingDays.has(new Date(`${date}T12:00:00`).getDay());
      const kcalTarget = isTrainingDay ? targets.trainingKcal : targets.restKcal;
      const carbsTarget = isTrainingDay ? targets.trainingCarbs : targets.restCarbs;
      const share = (part, whole) => {
        if (!whole || !part) return "";
        return `<span class="share">${Math.round(part / whole * 100)}%</span>`;
      };
      const macrosRow = (values, extras = {}, kind = "meal") => `<div class="totals${kind === "day" ? " day-totals" : kind === "meal" ? " meal-totals" : ""}">${[
        ["Калории", values.kcal, extras.kcal],
        ["Белок", values.p, extras.p],
        ["Жиры", values.f, extras.f],
        ["Углеводы", values.c, extras.c],
        ["Клетчатка", values.fiber, extras.fiber]
      ].map(([, value, extra], i) => {
        const st = extras.stat ? extras.stat[i] : null;
        const data = st ? ` data-pct="${st.pct}" data-tone="${st.tone}"` : "";
        return `<div class="total"${data}><span class="macros">${value}${extra || ""}</span></div>`;
      }).join("")}</div>`;
      const mealStat = x => [
        statusOf(x.kcal, kcalTarget),
        statusOf(x.p, targets.p, "floor"),
        statusOf(x.f, targets.f),
        statusOf(x.c, carbsTarget),
        statusOf(x.fiber, targets.fiber, "floor", {warnBelow:50})
      ];
      const mealsHtml = `<div class="meals">${rows.map(x => `<div class="meal"><div class="meal-time">${x.time}</div><div class="food">${escapeHtml(prettyFoods(x.foods))}</div>${macrosRow(
        {kcal:fmtInt(x.kcal),p:fmtInt(x.p),f:fmtInt(x.f),c:fmtInt(x.c),fiber:fmtInt(x.fiber)},
        {kcal:share(x.kcal,t.kcal),p:share(x.p,t.p),f:share(x.f,t.f),c:share(x.c,t.c),fiber:share(x.fiber,t.fiber),stat:mealStat(x)},
        "meal"
      )}</div>`).join("")}</div>`;
      const totalsHtml = macrosRow(
        {kcal:fmtInt(t.kcal),p:fmtInt(t.p),f:fmtInt(t.f),c:fmtInt(t.c),fiber:fmtInt(t.fiber)},
        {
          kcal:dayExtra(t.kcal, kcalTarget),
          p:dayExtra(t.p, targets.p, "floor"),
          f:dayExtra(t.f, targets.f),
          c:dayExtra(t.c, carbsTarget),
          fiber:dayExtra(t.fiber, targets.fiber, "floor", {warnBelow:50}),
          stat:[
            statusOf(t.kcal, kcalTarget),
            statusOf(t.p, targets.p, "floor"),
            statusOf(t.f, targets.f),
            statusOf(t.c, carbsTarget),
            statusOf(t.fiber, targets.fiber, "floor", {warnBelow:50})
          ]
        },
        "day"
      );
      if (date === today) {
        return `<section>
      <div class="day-head"><h1>${titleDay}</h1></div>
      ${totalsHtml}
      ${mealsHtml}
    </section>`;
      }
      const openYest = todayEmpty && date === yesterday;
      return `<section>
      <details class="day"${openYest ? " open" : ""}>
        <summary>
          <div class="day-head"><h1>${titleDay}</h1></div>
          ${totalsHtml}
        </summary>
        ${mealsHtml}
      </details>
    </section>`;
    }).join("");
    requestAnimationFrame(drawGraph);
  }

  function fetchCsv(url) {
    const bust = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    return fetch(`${url}?v=${bust}`, {
      cache: "no-store",
      headers: {
        "Cache-Control": "no-cache",
        Pragma: "no-cache"
      }
    }).then(async response => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const text = await response.text();
      if (!text || !text.includes("date,time,meal_type")) throw new Error("плохой CSV");
      return text;
    });
  }

  function loadData() {
    refreshBtn.disabled = true;
    refreshBtn.classList.add("is-loading");
    refreshBtn.setAttribute("aria-busy", "true");

    const fetches = csvUrls.map(url =>
      fetchCsv(url)
        .then(text => {
          const entries = parseCsv(text);
          if (!entries.length) throw new Error("пустой лог");
          return entries;
        })
        .catch(() => null)
    );

    return Promise.all(fetches).then(results => {
      const loaded = results.filter(Boolean);
      if (!loaded.length) {
        render(fallbackEntries);
        return;
      }
      const best = loaded.reduce(fresher);
      const merged = mergeEntries(best, fallbackEntries);
      render(merged);
    }).finally(() => {
      refreshBtn.disabled = false;
      refreshBtn.classList.remove("is-loading");
      refreshBtn.removeAttribute("aria-busy");
    });
  }

  const vizCycle = {rings:"graph", graph:"ribbon", ribbon:"rings"};
  const vizLabel = {rings:"График", graph:"Толщина", ribbon:"Кружки"};
  const applyViz = mode => {
    document.body.dataset.viz = mode;
    try { localStorage.setItem("dashboard-viz", mode); } catch (e) {}
    vizToggle.setAttribute("aria-label", vizLabel[mode]);
    vizToggle.title = vizLabel[mode];
    requestAnimationFrame(drawGraph);
  };
  let savedViz = "rings";
  try {
    const stored = localStorage.getItem("dashboard-viz");
    if (stored === "graph" || stored === "rings" || stored === "ribbon") savedViz = stored;
  } catch (e) {}
  applyViz(savedViz);
  vizToggle.addEventListener("click", () => {
    applyViz(vizCycle[document.body.dataset.viz] || "graph");
  });
  app.addEventListener("toggle", () => requestAnimationFrame(drawGraph), true);
  window.addEventListener("resize", () => requestAnimationFrame(drawGraph));
  refreshBtn.addEventListener("click", () => {
    refreshBtn.disabled = true;
    refreshBtn.classList.add("is-loading");
    // Жёсткое обновление: новый URL + bypass HTTP-кэша страницы/ассетов.
    const url = new URL(window.location.href);
    url.searchParams.set("r", String(Date.now()));
    window.location.replace(url.toString());
  });
  loadData();
</script>
</body>
</html>
