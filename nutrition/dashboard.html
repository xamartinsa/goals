<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10251d">
  <title>Питание и сила</title>
  <style>
    :root { --ink:#14211c; --muted:#6d786f; --line:#dfe6df; --paper:#f5f7f2; --card:#fff; --accent:#167a58; --accent-soft:#e2f4ea; --warn:#b96b18; --danger:#b94b4b; }
    * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width:1050px; margin:auto; padding:32px 20px 60px; }
    header { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:24px; }
    h1 { margin:0; font-size:clamp(28px,6vw,44px); line-height:1; letter-spacing:-.05em; } h1 span { color:var(--accent); }
    .sub, .updated { color:var(--muted); margin:8px 0 0; } .updated { font-size:13px; text-align:right; white-space:nowrap; }
    .hero { background:linear-gradient(135deg,#103729,#1a7858); color:white; border-radius:24px; padding:25px; margin-bottom:26px; box-shadow:0 12px 26px #174c3930; }
    .hero-top { display:flex; justify-content:space-between; gap:12px; align-items:center; } .hero h2 { font-size:17px; margin:0; font-weight:600; } .hero .date { color:#b7ead0; font-size:13px; }
    .cal { font-size:52px; font-weight:750; letter-spacing:-.06em; line-height:1; margin:22px 0 4px; } .cal small { font-size:17px; letter-spacing:0; font-weight:500; }
    .progress { margin-top:20px; } .progress-label { display:flex; justify-content:space-between; font-size:13px; color:#d5ebdf; margin-bottom:6px; } .bar { height:8px; border-radius:99px; background:#ffffff2e; overflow:hidden; } .bar>span { display:block; height:100%; background:#b2f1d1; border-radius:inherit; max-width:100%; }
    .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:26px; } .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; } .card b { display:block; font-size:25px; letter-spacing:-.04em; } .card span { color:var(--muted); font-size:13px; }
    section { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; margin-top:18px; } section h2 { font-size:18px; margin:0 0 14px; letter-spacing:-.02em; }
    .hint { color:var(--muted); font-size:13px; margin:-8px 0 16px; } .alert { border-left:3px solid var(--warn); border-radius:0 10px 10px 0; background:#fff8e9; color:#6d4a16; padding:11px 13px; margin-bottom:14px; font-size:14px; }
    table { width:100%; border-collapse:collapse; } th { color:var(--muted); text-align:left; font-weight:600; font-size:12px; padding:0 9px 8px; } td { border-top:1px solid var(--line); vertical-align:top; padding:12px 9px; } .time { color:var(--muted); white-space:nowrap; }.food { font-weight:600; }.portion, .notes { color:var(--muted); font-size:13px; margin-top:3px; }.macros { white-space:nowrap; font-variant-numeric:tabular-nums; }
    .day-grid { display:grid; grid-template-columns:110px 1fr auto; align-items:center; gap:12px; padding:13px 0; border-top:1px solid var(--line); } .day-grid:first-of-type { border-top:0; } .day { font-weight:650; } .day small { color:var(--muted); display:block; font-weight:400; }.mini { color:var(--muted); font-size:13px; }.kcal { font-weight:700; white-space:nowrap; }
    footer { color:var(--muted); font-size:12px; margin:22px 2px 0; } code { background:#e9eee8; padding:1px 4px; border-radius:4px; }
    @media(max-width:640px) { main { padding:24px 13px 44px; } header { display:block; }.updated { text-align:left; margin-top:12px; }.cards { grid-template-columns:repeat(2,1fr); }.card b { font-size:23px; } section { padding:16px 12px; overflow:hidden; } table { min-width:650px; }.table-scroll { overflow-x:auto; margin:0 -12px; padding:0 3px; }.day-grid { grid-template-columns:85px 1fr; }.day-grid .kcal { grid-column:2; }.hero { padding:20px; } }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>Питание <span>×</span> сила</h1><p class="sub">Москва · вес 81 кг · цель: КМС, до 83 кг</p></div>
    <p class="updated">Данные из <code>log.csv</code><br>обновлено: 26.07.2026</p>
  </header>
  <div id="app"></div>
  <footer>КБЖУ — оценка, а не лабораторное измерение. Источник истины: <code>nutrition/log.csv</code>.</footer>
</main>
<script>
  // Производная копия nutrition/log.csv. Агент обновляет этот массив после каждой правки CSV.
  const entries = [
    {date:"2026-07-25",time:"16:14",meal:"Завтрак",foods:"Осетинский пирог с ботвой и сыром; осетинский пирог с говядиной; квас",portion:"~1.75 пирога, ~125 мл кваса",kcal:955,p:37.5,f:42,c:101.5,fiber:5},
    {date:"2026-07-25",time:"22:23",meal:"Ужин",foods:"Куриное бедро в лепинье; окрошка; шопский салат; лимонад",portion:"полные порции по фото",kcal:1650,p:77,f:72,c:153,fiber:9},
    {date:"2026-07-26",time:"02:30",meal:"Перекус",foods:"Сидр сухой «Дальняя Дача» ×3",portion:"3 × 0.45 л",kcal:608,p:0,f:0,c:6.8,fiber:0},
    {date:"2026-07-26",time:"15:00",meal:"Завтрак",foods:"Теремок: ветчина-сыр; Алёша Попович; лаванда с заварным кремом",portion:"116 г + 221 г + 196 г",kcal:1528,p:53.7,f:85.6,c:137.2,fiber:2}
  ];
  const targets = { kcal:2550, p:170, f:65, c:0, fiber:28 };
  const fmt = n => Number.isInteger(n) ? n.toString() : n.toFixed(1).replace(".",",");
  const total = xs => xs.reduce((a,x) => ({kcal:a.kcal+x.kcal,p:a.p+x.p,f:a.f+x.f,c:a.c+x.c,fiber:a.fiber+x.fiber}), {kcal:0,p:0,f:0,c:0,fiber:0});
  const dates = [...new Set(entries.map(x=>x.date))].sort().reverse();
  const latest = dates[0], today = entries.filter(x=>x.date===latest), sum = total(today);
  const dateName = d => new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"long",year:"numeric"}).format(new Date(`${d}T12:00:00`));
  const target = (value, goal) => goal ? `${fmt(value)} / ${goal}` : fmt(value);
  const status = () => {
    const out=[]; if(sum.p<targets.p*.75) out.push("Белок пока низко — вечером добери нормальной едой или протеином.");
    if(sum.fiber<targets.fiber*.75) out.push("Клетчатка низкая — добавь овощи, фрукты или бобовые.");
    if(sum.f>targets.f*1.35) out.push("Жиров уже много — дальше лучше без сыра, фритюра и жирных соусов.");
    return out.length ? out.join(" ") : "По основным ориентирам пока без явного перекоса.";
  };
  const app = document.querySelector("#app");
  app.innerHTML = `
    <article class="hero">
      <div class="hero-top"><h2>Сегодня</h2><span class="date">${dateName(latest)}</span></div>
      <div class="cal">${fmt(sum.kcal)} <small>ккал</small></div>
      <div class="progress"><div class="progress-label"><span>Ориентир калорий</span><span>${fmt(sum.kcal)} / ${targets.kcal}</span></div><div class="bar"><span style="width:${sum.kcal/targets.kcal*100}%"></span></div></div>
    </article>
    <div class="cards">
      <div class="card"><b>${target(sum.p,targets.p)} г</b><span>белок</span></div>
      <div class="card"><b>${target(sum.f,targets.f)} г</b><span>жиры</span></div>
      <div class="card"><b>${fmt(sum.c)} г</b><span>углеводы</span></div>
      <div class="card"><b>${target(sum.fiber,targets.fiber)} г</b><span>клетчатка</span></div>
    </div>
    <section>
      <h2>Сегодняшние приёмы</h2>
      <p class="hint">${today.length} ${today.length===1?"запись":"записи"} · время МСК</p>
      <div class="alert">${status()}</div>
      <div class="table-scroll"><table><thead><tr><th>Время</th><th>Приём</th><th>Еда</th><th>КБЖУ</th></tr></thead><tbody>
        ${today.map(x=>`<tr><td class="time">${x.time}</td><td>${x.meal}</td><td><div class="food">${x.foods}</div><div class="portion">${x.portion}</div></td><td class="macros">${fmt(x.kcal)} ккал<br><span class="notes">Б ${fmt(x.p)} · Ж ${fmt(x.f)} · У ${fmt(x.c)}<br>кл. ${fmt(x.fiber)}</span></td></tr>`).join("")}
      </tbody></table></div>
    </section>
    <section><h2>Дни</h2>
      ${dates.map(d=>{const t=total(entries.filter(x=>x.date===d)); return `<div class="day-grid"><div class="day">${dateName(d)}<small>${entries.filter(x=>x.date===d).length} приёма</small></div><div class="mini">Б ${fmt(t.p)} · Ж ${fmt(t.f)} · У ${fmt(t.c)} · клетч. ${fmt(t.fiber)}</div><div class="kcal">${fmt(t.kcal)} ккал</div></div>`}).join("")}
    </section>`;
</script>
</body>
</html>
