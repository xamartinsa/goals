      padding:4px 0;

      font:13px/1.35 var(--mono);

    .totals .value { color:var(--ink); }

    .good { color:var(--good); }

    }
    return `<span class="pct ${tone}">${valuePct}%</span>`;
  };
  const total = xs => xs.reduce((a,x) => ({kcal:a.kcal+x.kcal,p:a.p+x.p,f:a.f+x.f,c:a.c+x.c,fiber:a.fiber+x.fiber}), {kcal:0,p:0,f:0,c:0,fiber:0});
  const app = document.querySelector("#app");
  const refreshBtn = document.querySelector("#refresh");
  const refreshStatus = document.querySelector("#refresh-status");
  const topMeta = document.querySelector("#top-meta");
  const csvUrls = [
    // raw обычно свежее: github.io иногда отдаёт старый log.csv из кэша Pages
    "https://raw.githubusercontent.com/xamartinsa/goals/cursor/nutrition-tracker-agent-5da8/nutrition/log.csv",
    "log.csv"
  ];
  // CSV — источник истины целиком (все строки, даже несколько в одну минуту).
  // Fallback дополняет только минуты, которых в CSV ещё нет — иначе старый
  // ключ date|time схлопывал обед+мороженое в 13:33 в одну запись.
  const latestDate = entries => entries.reduce((max, e) => (e.date > max ? e.date : max), "");
  const mergeEntries = (primary, secondary) => {
    const out = [...primary];
    const coveredSlots = new Set(primary.map(e => `${e.date}|${e.time}`));
    for (const e of secondary) {
      const slot = `${e.date}|${e.time}`;
      if (coveredSlots.has(slot)) continue;
      out.push(e);
      coveredSlots.add(slot);
    }
    return out;
  };
  const fresher = (a, b) => {
    const da = latestDate(a), db = latestDate(b);
    if (da !== db) return da > db ? a : b;
    return a.length >= b.length ? a : b;
  };

  const mealOrder = time => {
    const [hour, minute] = time.split(":").map(Number);
    const minutes = hour * 60 + minute;
    return minutes < 360 ? minutes + 1440 : minutes;
  };
  const displayTime = time => mealOrder(time) >= 1440 ? `${time} (+1)` : time;
  const escapeHtml = s => String(s)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");

  function moscowToday() {
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: "Europe/Moscow",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).format(new Date());
  }

  function moscowTime() {
    return new Date().toLocaleTimeString("ru-RU", {
      timeZone: "Europe/Moscow",
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  function shiftDate(isoDate, days) {
    const [y, m, d] = isoDate.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    dt.setUTCDate(dt.getUTCDate() + days);
    return dt.toISOString().slice(0, 10);
  }

  function dayTitle(date, today, yesterday) {
    if (date === today) return "Сегодня";
    if (date === yesterday) return "Вчера";
    return date.split("-").reverse().join(".");
  }

  function parseCsv(text) {
    const rows = [], row = [];
    let field = "", quoted = false;
    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      if (quoted) {
        if (char === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (char === '"') quoted = false;
        else field += char;
      } else if (char === '"') quoted = true;
      else if (char === ",") { row.push(field); field = ""; }
      else if (char === "\n") { row.push(field); rows.push(row.splice(0)); field = ""; }
      else if (char !== "\r") field += char;
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    const [headers, ...data] = rows;
    return data.filter(row => row.length === headers.length).map(row => {
      const item = Object.fromEntries(headers.map((key, index) => [key, row[index]]));
      return { date:item.date, time:item.time, meal_type:item.meal_type || "", foods:item.foods,
        kcal:Number(item.kcal), p:Number(item.protein_g), f:Number(item.fat_g),
        c:Number(item.carbs_g), fiber:Number(item.fiber_g) };
    });
  }

  function render(entries) {
    const today = moscowToday();
    const yesterday = shiftDate(today, -1);
    const dates = [...new Set([today, ...entries.map(x => x.date)])].sort().reverse();
    app.innerHTML = dates.map(date => {
      const rows = entries.filter(x => x.date === date).sort((a, b) => mealOrder(b.time) - mealOrder(a.time));
      const titleDay = dayTitle(date, today, yesterday);
      const isTrainingDay = trainingDays.has(new Date(`${date}T12:00:00`).getDay());
      const dayKind = isTrainingDay ? "training" : "rest";
      if (!rows.length) {
        return `<section>
      <div class="day-head"><h1>${titleDay}</h1><div class="day-tag">${dayKind}</div></div>
      <div class="empty">// пока ничего</div>
    </section>`;
      }
      const t = total(rows);
      const kcalTarget = isTrainingDay ? targets.trainingKcal : targets.restKcal;
      const carbsTarget = isTrainingDay ? targets.trainingCarbs : targets.restCarbs;
      const mealsHtml = rows.map(x => `<div class="meal"><div class="meal-time">${displayTime(x.time)}</div><div class="food">${escapeHtml(x.foods)}</div><div class="meal-macros">${fmt(x.kcal)} kcal · P ${fmt(x.p)} · F ${fmt(x.f)} · C ${fmt(x.c)} · fiber ${fmt(x.fiber)}</div></div>`).join("");
      return `<section>
      <div class="day-head"><h1>${titleDay}</h1><div class="day-tag">${dayKind}</div></div>
      <div class="totals">
        <div><span class="label">calories</span><span class="value">${fmt(t.kcal)} kcal ${pct(t.kcal, kcalTarget)}</span></div>
        <div><span class="label">protein</span><span class="value">${fmt(t.p)} g ${pct(t.p, targets.p, "floor")}</span></div>
        <div><span class="label">fat</span><span class="value">${fmt(t.f)} g ${pct(t.f, targets.f)}</span></div>
        <div><span class="label">carbs</span><span class="value">${fmt(t.c)} g ${pct(t.c, carbsTarget)}</span></div>
        <div><span class="label">fiber</span><span class="value">${fmt(t.fiber)} g ${pct(t.fiber, targets.fiber, "floor")}</span></div>
      </div>
      ${mealsHtml}
    </section>`;
    }).join("");
  }

  function fetchCsv(url) {
    const bust = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    return fetch(`${url}?v=${bust}`, {
      cache: "no-store",
      headers: {
        "Cache-Control": "no-cache",
        Pragma: "no-cache"
      }
    }).then(async response => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const text = await response.text();
      if (!text || !text.includes("date,time,meal_type")) throw new Error("плохой CSV");
      return text;
    });
  }

  function loadData() {
    refreshBtn.disabled = true;
    refreshBtn.textContent = "Обновляю…";
    refreshStatus.textContent = "";

    const fetches = csvUrls.map(url =>
      fetchCsv(url)
        .then(text => {
          const entries = parseCsv(text);
          if (!entries.length) throw new Error("пустой лог");
          return entries;
        })
        .catch(() => null)
    );

    return Promise.all(fetches).then(results => {
      const loaded = results.filter(Boolean);
      if (!loaded.length) {
        render(fallbackEntries);
        refreshStatus.textContent = "offline";
        if (topMeta) topMeta.textContent = "offline · МСК";
        return;
      }
      const best = loaded.reduce(fresher);
      const merged = mergeEntries(best, fallbackEntries);
      render(merged);
      const until = latestDate(merged).split("-").reverse().join(".");
      refreshStatus.textContent = `${moscowTime()} · until ${until}`;
      if (topMeta) topMeta.textContent = `synced ${moscowTime()} · МСК`;
    }).finally(() => {
      refreshBtn.disabled = false;
      refreshBtn.textContent = "Обновить";
    });
  }

  refreshBtn.addEventListener("click", () => { loadData(); });
  loadData();
</script>
</body>
</html>
