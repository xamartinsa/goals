  <style>
    :root {
      --ink:#000;
      --muted:#555;
      --label:#9a9a9a;
      --line:#e2e2e2;
      --bg:#fff;
      --card:#fff;
      --good:#28734a;
      --great:#14532d;
      --low:#a16d00;
      --high:#b3261e;
      --font:"IBM Plex Sans", system-ui, sans-serif;
      --font-cond:"Barlow Extra Condensed", "IBM Plex Sans Condensed", sans-serif;
    }
    * { box-sizing:border-box; }
    html, body { min-height:100%; }
    body {
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font:16px/1.45 var(--font);
      letter-spacing:-0.01em;
    }
    main {
      max-width:720px;
      margin:0 auto;
      padding:16px 22px calc(120px + env(safe-area-inset-bottom, 0px));
    }
    h1 {
      font-size:18px;
      font-weight:700;
      margin:0;
      letter-spacing:-0.02em;
    }
    .day-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin:0 0 6px;
    }
    .day-head h1 { flex:1; min-width:0; }
    .chevron {
      flex:0 0 auto;
      width:12px;
      height:12px;
      color:var(--label);
      transition:transform .15s ease;
    }
    .chevron svg { display:block; width:12px; height:12px; }
    details.day > summary {
      list-style:none;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    details.day > summary::-webkit-details-marker { display:none; }
    details.day[open] .chevron { transform:rotate(180deg); }
    details.day > summary .totals { margin-bottom:0; }
    details.day[open] .meals { margin-top:8px; }
    .meta { margin:0 0 22px; color:var(--muted); font-size:13px; }
    .empty { margin:8px 0 0; color:var(--muted); }
    .totals {
      display:flex;
      flex-direction:row;
      flex-wrap:nowrap;
      justify-content:space-between;
      align-items:flex-start;
      gap:8px;
      width:100%;
      margin:0 0 28px;
    }
    .total {
      display:flex;
      flex:1 1 0;
      min-width:0;
      flex-direction:column;
      align-items:flex-start;
      gap:0;
    }
    .total-label {
      font-size:8px;
      line-height:1.2;
      font-weight:700;
      letter-spacing:0;
      text-transform:uppercase;
      font-variant:small-caps;
      color:var(--label);
    }
    .macros, .pct {
      font-family:var(--font-cond);
      font-size:14px;
      line-height:1.45;
      font-weight:500;
      letter-spacing:0;
    }
    .pct { margin-left:0.12em; }
    .mark {
      display:inline-flex;
      align-items:center;
      margin-left:0.16em;
      vertical-align:-0.08em;
    }
    .mark:empty { display:none; }
    .mark svg { display:block; }
    .mark-ok { color:#1f9d55; }
    .mark-signal { width:16px; height:16px; }
    .mark-signal .tick {
      fill:none;
      stroke:#fff;
      stroke-width:1.7;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .mark-signal .ring { opacity:.08; }
    .bars-1 .mark-signal .ring:nth-child(1) { opacity:.42; }
    .bars-2 .mark-signal .ring:nth-child(1) { opacity:.72; }
    .bars-2 .mark-signal .ring:nth-child(2) { opacity:.42; }
    .bars-3 .mark-signal .ring:nth-child(1) { opacity:.88; }
    .bars-3 .mark-signal .ring:nth-child(2) { opacity:.62; }
    .bars-3 .mark-signal .ring:nth-child(3) { opacity:.38; }
    .bars-4 .mark-signal .ring:nth-child(1) { opacity:1; }
    .bars-4 .mark-signal .ring:nth-child(2) { opacity:.75; }
    .bars-4 .mark-signal .ring:nth-child(3) { opacity:.5; }
    .bars-4 .mark-signal .ring:nth-child(4) { opacity:.25; }
    body[data-view="icons"] .pct { display:none; }
    body[data-view="pct"] .mark { display:none; }
    .view-toggle {
      position:fixed;
      top:max(12px, env(safe-area-inset-top, 0px));
      right:max(16px, env(safe-area-inset-right, 0px));
      z-index:1000;
      appearance:none;
      border:0;
      background:none;
      padding:8px 2px;
      font:12px/1 var(--font-cond);
      color:var(--label);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .meals {
      display:flex;
      flex-direction:column;
      gap:12px;
      margin-top:10px;
      padding:12px 14px;
      border-radius:14px;
      background:#f7f7f7;
    }
    .meal { padding:0; border:0; background:none; }
    .meal-time {
      font-size:11px;
      line-height:1.3;
      color:var(--label);
      opacity:.45;
    }
    .meal .food { font-size:13px; font-weight:400; }
    .meal .totals { margin:4px 0 0; }
    .meal .total-label { display:none; }
    .meal .macros { font-size:12px; }
    .good { color:var(--good); }
    .great { color:var(--great); }
    .low { color:var(--low); }
    .high { color:var(--high); }
    .food { font-weight:400; }
    section { margin:0 0 22px; }
    .refresh-wrap {
      position:fixed;
      bottom:max(16px, env(safe-area-inset-bottom, 0px));
      right:max(16px, env(safe-area-inset-right, 0px));
      z-index:1000;
    }
    .refresh {
      appearance:none;
      width:44px;
      height:44px;
      padding:0;
      border:1px solid rgba(255,255,255,.9);
      border-radius:50%;
      background:rgba(236,236,236,.42);
      color:#000;
      display:grid;
      place-items:center;
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      box-shadow:0 1px 8px rgba(0,0,0,.05);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
    }
    .refresh svg { width:22px; height:22px; display:block; }
    .refresh:active { background:rgba(220,220,220,.55); }
    .refresh[disabled] { opacity:.55; cursor:wait; }
    .refresh.is-loading svg { animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (max-width:520px) { body { font-size:14px; } h1 { font-size:16px; } }
  </style>

    {date:"2026-08-10",time:"17:00",foods:"Kinder Country (кранч); фильтр",kcal:137,p:2.0,f:7.9,c:12.9,fiber:0.3},
    {date:"2026-08-10",time:"19:14",foods:"Exponenta High-Pro безлактозная 250 г",kcal:150,p:30.0,f:0.0,c:6.3,fiber:0.0},
    {date:"2026-08-10",time:"22:18",foods:"Творог 5% 180 г; ½ бананового коктейля 0.5 л",kcal:386,p:38.0,f:14.0,c:27.0,fiber:0.0},
    {date:"2026-08-10",time:"00:38",foods:"Джерки ×2 пачки 90 г; кола zero",kcal:232,p:50.0,f:4.6,c:0.0,fiber:0.0},
    {date:"2026-08-11",time:"12:51",meal_type:"lunch",foods:"Крылья ×3; треска в яйце; гречка; 2 салата",kcal:800,p:62.0,f:33.0,c:78.0,fiber:10.0},
    {date:"2026-08-11",time:"13:10",meal_type:"snack",foods:"Вологодский пломбир шоколадный стаканчик 100 г",kcal:210,p:4.0,f:11.5,c:22.0,fiber:0.5},
    {date:"2026-08-11",time:"17:19",meal_type:"snack",foods:"Запеканка картофельная с мясом Самокат 230 г",kcal:311,p:20.7,f:9.2,c:34.5,fiber:2.0},
    {date:"2026-08-12",time:"13:33",meal_type:"lunch",foods:"Бун ча с курицей; шашлычок; лапша; соус; ростки",kcal:855,p:69.0,f:24.0,c:90.0,fiber:4.5},
    {date:"2026-08-12",time:"13:33",meal_type:"snack",foods:"Пломбир двухслойный шоколадный 105 г",kcal:258,p:4.1,f:15.1,c:26.5,fiber:0.5},
  ];
  const targets = {
    restKcal:2250, trainingKcal:2500,
    restCarbs:245, trainingCarbs:308,
    p:160, f:70, fiber:27.5
  };
  const trainingDays = new Set([0, 2, 5]); // вс, вт, пт
  const fmt = n => Number.isInteger(n) ? String(n) : n.toFixed(1).replace(".",",");
  const fmtInt = n => String(Math.round(n));
  const percent = (value, target) => Math.round(value / target * 20) * 5;
  // mode "floor": белок/клетчатка — чем больше, тем лучше (не красить в красный)
  // mode "ceiling": ккал/жиры/углеводы — перебор = high
  const pct = (value, target, mode = "ceiling") => {
    const valuePct = percent(value, target);
    let tone;
    if (mode === "floor") {
      tone = valuePct < 70 ? "low" : valuePct >= 100 ? "great" : "good";
    } else {
      tone = valuePct < 70 ? "low" : valuePct > 110 ? "high" : "good";
    }
    return `<span class="pct ${tone}">${valuePct}%</span>`;
  };
  const rings = `<circle class="ring" cx="8" cy="8" r="1.8" fill="currentColor"/><circle class="ring" cx="8" cy="8" r="2.7" fill="none" stroke="currentColor" stroke-width="1.8"/><circle class="ring" cx="8" cy="8" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle class="ring" cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.8"/>`;
  const signalSvg = `<svg class="mark-signal" viewBox="0 0 16 16" aria-hidden="true">${rings}</svg>`;
  const checkSvg = `<svg class="mark-signal" viewBox="0 0 16 16" aria-hidden="true">${rings}<path class="tick" d="M4.15 8.2 6.75 10.7 11.85 5.35"/></svg>`;
  const mark = (value, target, mode = "ceiling", opts = {}) => {
    const valuePct = percent(value, target);
    if (mode === "floor") {
      if (opts.warnBelow && valuePct < 95) {
        const bars = valuePct < 50 ? 1 : 2;
        return `<span class="mark low bars-${bars}" title="${valuePct}%">${signalSvg}</span>`;
      }
      if (valuePct >= 95) return `<span class="mark mark-ok bars-4" title="${valuePct}%">${checkSvg}</span>`;
      if (valuePct >= 70) return `<span class="mark mark-ok bars-3" title="${valuePct}%">${checkSvg}</span>`;
      if (valuePct > 0) return `<span class="mark mark-ok bars-2" title="${valuePct}%">${checkSvg}</span>`;
      return "";
    }
    const bars = valuePct > 150 ? 4 : valuePct > 130 ? 3 : valuePct > 110 ? 2 : 0;
    if (bars) return `<span class="mark high bars-${bars}" title="${valuePct}%">${signalSvg}</span>`;
    if (valuePct >= 70) return `<span class="mark mark-ok bars-4" title="${valuePct}%">${checkSvg}</span>`;
    return "";
  };
  const dayExtra = (value, target, mode = "ceiling", opts = {}) => `${mark(value, target, mode, opts)}${pct(value, target, mode)}`;
  const total = xs => xs.reduce((a,x) => ({kcal:a.kcal+x.kcal,p:a.p+x.p,f:a.f+x.f,c:a.c+x.c,fiber:a.fiber+x.fiber}), {kcal:0,p:0,f:0,c:0,fiber:0});
  const app = document.querySelector("#app");
  const refreshBtn = document.querySelector("#refresh");
  const csvUrls = [
    // raw обычно свежее: github.io иногда отдаёт старый log.csv из кэша Pages
    "https://raw.githubusercontent.com/xamartinsa/goals/cursor/nutrition-tracker-agent-5da8/nutrition/log.csv",
    "log.csv"
  ];
  // CSV — источник истины целиком (все строки, даже несколько в одну минуту).
  // Fallback дополняет только минуты, которых в CSV ещё нет — иначе старый
  // ключ date|time схлопывал обед+мороженое в 13:33 в одну запись.
  const latestDate = entries => entries.reduce((max, e) => (e.date > max ? e.date : max), "");
  const mergeEntries = (primary, secondary) => {
    const out = [...primary];
    const coveredSlots = new Set(primary.map(e => `${e.date}|${e.time}`));
    for (const e of secondary) {
      const slot = `${e.date}|${e.time}`;
      if (coveredSlots.has(slot)) continue;
      out.push(e);
      coveredSlots.add(slot);
    }
    return out;
  };
  const fresher = (a, b) => {
    const da = latestDate(a), db = latestDate(b);
    if (da !== db) return da > db ? a : b;
    return a.length >= b.length ? a : b;
  };

  const mealOrder = time => {
    const [hour, minute] = time.split(":").map(Number);
    const minutes = hour * 60 + minute;
    return minutes < 360 ? minutes + 1440 : minutes;
  };
  const displayTime = time => mealOrder(time) >= 1440 ? `${time} (+1)` : time;
  const escapeHtml = s => String(s)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
  const prettyFoods = s => String(s)
    .replace(/кофе фильтр/gi, "фильтр-кофе")
    .replace(/(^|;\s*)(\S)/g, (_, p, c) => p + c.toLocaleUpperCase("ru"));

  function moscowToday() {
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: "Europe/Moscow",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).format(new Date());
  }

  function shiftDate(isoDate, days) {
    const [y, m, d] = isoDate.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    dt.setUTCDate(dt.getUTCDate() + days);
    return dt.toISOString().slice(0, 10);
  }

  const monthNames = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  function dayTitle(date, today, yesterday) {
    if (date === today) return "Сегодня";
    if (date === yesterday) return "Вчера";
    const [y, m, d] = date.split("-").map(Number);
    return `${d} ${monthNames[m - 1]}`;
  }

  function parseCsv(text) {
    const rows = [], row = [];
    let field = "", quoted = false;
    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      if (quoted) {
        if (char === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (char === '"') quoted = false;
        else field += char;
      } else if (char === '"') quoted = true;
      else if (char === ",") { row.push(field); field = ""; }
      else if (char === "\n") { row.push(field); rows.push(row.splice(0)); field = ""; }
      else if (char !== "\r") field += char;
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    const [headers, ...data] = rows;
    return data.filter(row => row.length === headers.length).map(row => {
      const item = Object.fromEntries(headers.map((key, index) => [key, row[index]]));
      return { date:item.date, time:item.time, meal_type:item.meal_type || "", foods:item.foods,
        kcal:Number(item.kcal), p:Number(item.protein_g), f:Number(item.fat_g),
        c:Number(item.carbs_g), fiber:Number(item.fiber_g) };
    });
  }

  function render(entries) {
    const today = moscowToday();
    const yesterday = shiftDate(today, -1);
    const dates = [...new Set([today, ...entries.map(x => x.date)])].sort().reverse();
    const todayEmpty = !entries.some(x => x.date === today);
    app.innerHTML = dates.map(date => {
      const rows = entries.filter(x => x.date === date).sort((a, b) => mealOrder(b.time) - mealOrder(a.time));
      const titleDay = date === today && !rows.length ? "Сегодня пока пусто" : dayTitle(date, today, yesterday);
      if (!rows.length) {
        return `<section>
      <div class="day-head"><h1>${titleDay}</h1></div>
    </section>`;
      }
      const t = total(rows);
      const isTrainingDay = trainingDays.has(new Date(`${date}T12:00:00`).getDay());
      const kcalTarget = isTrainingDay ? targets.trainingKcal : targets.restKcal;
      const carbsTarget = isTrainingDay ? targets.trainingCarbs : targets.restCarbs;
      const macrosRow = (values, extras = {}) => `<div class="totals">${[
        ["Калории", values.kcal, extras.kcal],
        ["Белок", values.p, extras.p],
        ["Жиры", values.f, extras.f],
        ["Углеводы", values.c, extras.c],
        ["Клетчатка", values.fiber, extras.fiber]
      ].map(([label, value, extra]) => `<div class="total"><span class="total-label">${label}</span><span class="macros">${value}${extra || ""}</span></div>`).join("")}</div>`;
      const mealsHtml = `<div class="meals">${rows.map(x => `<div class="meal"><div class="meal-time">${displayTime(x.time)}</div><div class="food">${escapeHtml(prettyFoods(x.foods))}</div>${macrosRow({kcal:fmt(x.kcal),p:fmt(x.p),f:fmt(x.f),c:fmt(x.c),fiber:fmt(x.fiber)})}</div>`).join("")}</div>`;
      const totalsHtml = macrosRow(
        {kcal:fmtInt(t.kcal),p:fmtInt(t.p),f:fmtInt(t.f),c:fmtInt(t.c),fiber:fmtInt(t.fiber)},
        {kcal:dayExtra(t.kcal, kcalTarget),p:dayExtra(t.p, targets.p, "floor"),f:dayExtra(t.f, targets.f),c:dayExtra(t.c, carbsTarget),fiber:dayExtra(t.fiber, targets.fiber, "floor", {warnBelow:50})}
      );
      const chevron = `<span class="chevron" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3.2 5.6 8 10.4l4.8-4.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
      if (date === today) {
        return `<section>
      <div class="day-head"><h1>${titleDay}</h1></div>
      ${totalsHtml}
      ${mealsHtml}
    </section>`;
      }
      const openYest = todayEmpty && date === yesterday;
      return `<section>
      <details class="day"${openYest ? " open" : ""}>
        <summary>
          <div class="day-head"><h1>${titleDay}</h1>${chevron}</div>
          ${totalsHtml}
        </summary>
        ${mealsHtml}
      </details>
    </section>`;
    }).join("");
  }

  function fetchCsv(url) {
    const bust = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    return fetch(`${url}?v=${bust}`, {
      cache: "no-store",
      headers: {
        "Cache-Control": "no-cache",
        Pragma: "no-cache"
      }
    }).then(async response => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const text = await response.text();
      if (!text || !text.includes("date,time,meal_type")) throw new Error("плохой CSV");
      return text;
    });
  }

  function loadData() {
    refreshBtn.disabled = true;
    refreshBtn.classList.add("is-loading");
    refreshBtn.setAttribute("aria-busy", "true");

    const fetches = csvUrls.map(url =>
      fetchCsv(url)
        .then(text => {
          const entries = parseCsv(text);
          if (!entries.length) throw new Error("пустой лог");
          return entries;
        })
        .catch(() => null)
    );

    return Promise.all(fetches).then(results => {
      const loaded = results.filter(Boolean);
      if (!loaded.length) {
        render(fallbackEntries);
        return;
      }
      const best = loaded.reduce(fresher);
      const merged = mergeEntries(best, fallbackEntries);
      render(merged);
    }).finally(() => {
      refreshBtn.disabled = false;
      refreshBtn.classList.remove("is-loading");
      refreshBtn.removeAttribute("aria-busy");
    });
  }

  const viewToggle = document.querySelector("#viewToggle");
  const applyView = view => {
    document.body.dataset.view = view;
    try { localStorage.setItem("dashboard-view", view); } catch (e) {}
    const showPct = view === "pct";
    viewToggle.textContent = showPct ? "✓" : "%";
    viewToggle.setAttribute("aria-label", showPct ? "Показать иконки" : "Показать проценты");
  };
  let savedView = "icons";
  try {
    const stored = localStorage.getItem("dashboard-view");
    if (stored === "pct" || stored === "icons") savedView = stored;
  } catch (e) {}
  applyView(savedView);
  viewToggle.addEventListener("click", () => {
    applyView(document.body.dataset.view === "icons" ? "pct" : "icons");
  });
  refreshBtn.addEventListener("click", () => {
    refreshBtn.disabled = true;
    refreshBtn.classList.add("is-loading");
    // Жёсткое обновление: новый URL + bypass HTTP-кэша страницы/ассетов.
    const url = new URL(window.location.href);
    url.searchParams.set("r", String(Date.now()));
    window.location.replace(url.toString());
  });
  loadData();
</script>
</body>
